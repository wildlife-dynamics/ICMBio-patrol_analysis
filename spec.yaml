    Patrol Style.properties.trajs_layer.properties.layer_style.properties.pickable.ecoscope:advanced: true
    Patrol Style.properties.trajs_layer.properties.layer_style.properties.get_path.type: string
    Patrol Style.properties.trajs_layer.properties.layer_style.properties.get_path.default: geometry.coordinates
    Patrol Style.properties.trajs_layer.properties.layer_style.properties.get_path.enum: [geometry.coordinates]
    Patrol Style.properties.trajs_layer.properties.layer_style.properties.get_path.title: Path
