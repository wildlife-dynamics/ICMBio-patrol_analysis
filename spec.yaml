id: patrol_analysis

requirements:
  - name: ecoscope-platform
    version: ">=2.17.0,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.1"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: ecoscope-workflows-ext-icmbio
    version: "0.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

rjsf-overrides:
  properties:
    Patrol Style.properties.trajs_legend_title.properties.var.title: Title
    Patrol Style.properties.trajs_legend_title.properties.var.description: Legend title for patrol tracks.
    Patrol Style.properties.trajs_legend_title.properties.var.default: Tipo de patrulha
    Patrol Style.properties.trajs_legend_title.properties.var.ecoscope:advanced: false

    Patrol Style.properties.patrol_colormap.properties.input_column_name.title: Groupby
    Patrol Style.properties.patrol_colormap.properties.input_column_name.description: Color patrol tracks by the selected attribute. Each unique value is assigned a distinct color on the map.
    Patrol Style.properties.patrol_colormap.properties.input_column_name.default: extra__patrol_type__display
    Patrol Style.properties.patrol_colormap.properties.input_column_name.ecoscope:advanced: false
    Patrol Style.properties.patrol_colormap.properties.input_column_name.oneOf:
      - const: extra__patrol_type__display
        title: Patrol Type
      - const: extra__patrol_serial_number
        title: Patrol ID
    Patrol Style.properties.patrol_colormap.properties.colormap.title: Palette
    Patrol Style.properties.patrol_colormap.properties.colormap.description: Choose a color palette. For low-cardinality data (e.g. patrol type) any palette works; for high-cardinality data (e.g. IDs) use tab20, tab20b, or tab20c to reduce color repetition.
    Patrol Style.properties.patrol_colormap.properties.colormap.default: "Set2"
    Patrol Style.properties.patrol_colormap.properties.colormap.ecoscope:advanced: false
    Patrol Style.properties.patrol_colormap.properties.custom_colors.title: Custom Colors
    Patrol Style.properties.patrol_colormap.properties.custom_colors.description: "Leave empty to use the palette above. When provided, these colors are applied instead."
    Patrol Style.properties.patrol_colormap.properties.custom_colors.ecoscope:advanced: false

    Event Style.properties.event_legend_title.properties.var.title: Title
    Event Style.properties.event_legend_title.properties.var.description: Legend title for events.
    Event Style.properties.event_legend_title.properties.var.default: Tipo de evento
    Event Style.properties.event_legend_title.properties.var.ecoscope:advanced: false
    Event Style.properties.event_colormap.properties.input_column_name.title: Groupby
    Event Style.properties.event_colormap.properties.input_column_name.description: Color events by the selected attribute. Each unique value is assigned a distinct color on the map.
    Event Style.properties.event_colormap.properties.input_column_name.default: event_type_display
    Event Style.properties.event_colormap.properties.input_column_name.ecoscope:advanced: false
    Event Style.properties.event_colormap.properties.input_column_name.oneOf:
      - const: event_type_display
        title: Event Type
      - const: event_category
        title: Event Category
      - const: serial_number
        title: Event ID
    Event Style.properties.event_colormap.properties.colormap.title: Palette
    Event Style.properties.event_colormap.properties.colormap.description: Choose a color palette. For low-cardinality data (e.g. event type) any palette works; for high-cardinality data (e.g. IDs) use tab20, tab20b, or tab20c to reduce color repetition.
    Event Style.properties.event_colormap.properties.colormap.default: "Set2"
    Event Style.properties.event_colormap.properties.colormap.ecoscope:advanced: false
    Event Style.properties.event_colormap.properties.custom_colors.title: Custom Colors
    Event Style.properties.event_colormap.properties.custom_colors.description: "Leave empty to use the palette above. When provided, these colors are applied instead."
    Event Style.properties.event_colormap.properties.custom_colors.ecoscope:advanced: false

    Patrol Report.properties.report_template_path.properties.var.title: Template Path
    Patrol Report.properties.report_template_path.properties.var.description: "Path or URL to the .docx Jinja2 template used for the patrol report."
    Patrol Report.properties.report_template_path.properties.var.default: "https://raw.githubusercontent.com/wildlife-dynamics/ICMBio-patrol_analysis/main/resources/templates/relatorio_bimestral_template.docx"
    Patrol Report.properties.report_template_path.properties.var.ecoscope:advanced: false

    download_attachments.properties.skip_download.title: Skip Photo Attachments
    download_attachments.properties.skip_download.description: "If True, skip downloading event photos, and the report will not include any images."
    download_attachments.properties.skip_download.ecoscope:advanced: false

    # ── Map viewport (shared by Patrol Coverage Map + Events Map) ─────────────
    # viewport_settings' own fields already carry real title/description/
    # ecoscope:advanced via AdvancedField on the ViewportSettings model
    # itself (ecoscope_workflows_ext_icmbio/tasks/_map_utils.py) — no
    # per-field overrides needed for those, just a friendlier wrapper
    # title/description, and the wrapper itself marked advanced (matches
    # icf/workflows/patrol_events' pattern of marking the parent
    # layer_style object advanced too, not just its children).
    Map Viewport.properties.viewport_settings.properties.settings.title: Map Viewport
    Map Viewport.properties.viewport_settings.properties.settings.description: "Controls how tightly every map zooms and frames its data. Applies to all maps at once. Only adjust if maps consistently look too zoomed in or out."
    Map Viewport.properties.viewport_settings.properties.settings.ecoscope:advanced: true

    # ── Layer style exposure (patrol tracks / events / time density) ──────────
    # layer_style is left out of partial: in the workflow section above so
    # these become real, user-editable form fields (matches apn/workflows/
    # patrol_event/spec.yaml's real pattern, read in full — every field
    # below mirrors its exact technique). Field list per model verified
    # directly against our own compiled rjsf.json's $defs (not guessed):
    # PathLayerStyle (trajs_layer), ScatterplotLayerStyle (event_layer),
    # PolygonLayerStyle (time_density_layer). get_color/get_fill_color/
    # get_line_color/get_path/get_position/get_polygon are declared here
    # (fixed default + single-value enum) but hidden from the form via
    # uiSchema below — they're derived from the colormap step, not a style
    # choice. get_width/get_radius/get_line_width/get_elevation have a base
    # type of anyOf:[string, number] (a column-name OR a fixed value) —
    # each is collapsed to a single numeric option, matching apn's exact
    # technique (an unresolved 2-option anyOf risks the same rendering
    # failure as the allOf/bare-$ref gotcha documented in ETD/docs/
    # rjsf-anyof-switch-blanking-bug.md). layer_style's own .description is
    # blanked (apn does the same) so the auto-generated "Style arguments
    # for the layer." text doesn't show above the field list.

    Patrol Style.properties.trajs_layer.properties.layer_style.description: ""
    Patrol Style.properties.trajs_layer.properties.layer_style.properties.auto_highlight.type: boolean
    Patrol Style.properties.trajs_layer.properties.layer_style.properties.auto_highlight.default: false
    Patrol Style.properties.trajs_layer.properties.layer_style.properties.auto_highlight.title: Auto Highlight
    Patrol Style.properties.trajs_layer.properties.layer_style.properties.auto_highlight.description: Enable automatic highlighting when hovering over a patrol track.
