  $defs:
    EarthRangerSource:
      title: EarthRanger
      type: object
      properties:
        query:
          title: Query
          default: null
          anyOf:
            - type: "null"
              title: "--- select ---"
            - $ref: "#/$defs/FeatureSetQuery"
            - $ref: "#/$defs/FeatureTypeQuery"
            - $ref: "#/$defs/FeatureIdQuery"

  uiSchema:
    Spatial Features.spatial_features.source:
      ui:options:
        label: false
    Spatial Features.spatial_features.source.query:
      ui:options:
        label: false
    Spatial Features.spatial_features.source.query.anyOf:
      - ui:options:
          label: false
      - ui:options:
          label: false
      - ui:options:
          label: false
