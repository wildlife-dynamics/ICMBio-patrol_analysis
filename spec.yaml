    Patrol Style.properties.trajs_layer.properties.layer_style.properties.get_path.enum: [geometry.coordinates]
    Patrol Style.properties.trajs_layer.properties.layer_style.properties.get_path.title: Path
    Patrol Style.properties.trajs_layer.properties.layer_style.properties.get_path.description: Column or expression used to determine the path coordinates.
    Patrol Style.properties.trajs_layer.properties.layer_style.properties.get_path.ecoscope:advanced: true
    Patrol Style.properties.trajs_layer.properties.layer_style.properties.get_color.type: string
